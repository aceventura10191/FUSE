<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan for our menu — Flavour Fusion Hub</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,50;1,9..144,400..700,50&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    @page { size: A5 portrait; margin: 0; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: #d9cfbf;
      color: #211b16;
      font-family: "Karla", "Helvetica Neue", Arial, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .sheet {
      width: 148mm;
      height: 210mm;
      margin: 2rem auto;
      padding: 16mm 14mm 14mm;
      background: #f4ede1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }

    .kicker {
      margin: 0;
      font-size: 8.5pt;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #c2481a;
    }

    h1 {
      margin: 4mm 0 0;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 34pt;
      line-height: .95;
      letter-spacing: -.02em;
      font-variation-settings: "opsz" 144, "SOFT" 50;
    }

    h1 em {
      font-weight: 500;
      color: #c2481a;
    }

    .lede {
      margin: 5mm 0 0;
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-size: 14pt;
      color: #6a5e52;
    }

    .qr {
      margin: 9mm 0 0;
      width: 78mm;
      height: 78mm;
      padding: 3mm;
      background: #fff;
      border: 1px solid #c9bba3;
    }

    .qr img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .url {
      margin: 4mm 0 0;
      font-size: 9pt;
      color: #6a5e52;
      letter-spacing: .02em;
    }

    .footer {
      margin-top: auto;
      width: 100%;
      padding-top: 5mm;
      border-top: 1px solid #c9bba3;
      font-size: 10pt;
      color: #6a5e52;
    }

    .footer strong {
      display: block;
      font-family: "Fraunces", Georgia, serif;
      font-size: 17pt;
      font-weight: 600;
      color: #211b16;
      margin-top: 1mm;
    }

    .hint {
      max-width: 148mm;
      margin: 0 auto 2rem;
      font-size: .9rem;
      color: #5a4f45;
      text-align: center;
    }

    @media print {
      html, body { background: #f4ede1; }
      .sheet { margin: 0; box-shadow: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <p class="kicker">Shawarma &middot; Fries &middot; Combos</p>
    <h1>Flavour Fusion <em>Hub</em></h1>
    <p class="lede">Scan for our latest menu and prices.</p>

    <div class="qr">
      <img src="menu-qr.svg" alt="QR code linking to the Flavour Fusion Hub menu">
    </div>
    <p class="url">aceventura10191.github.io/FUSE</p>

    <div class="footer">
      For delivery, call us
      <strong>0742 004 759</strong>
      or find us on Glovo and Uber Eats
    </div>
  </div>

  <p class="hint">Print at A5 (or A4 scaled to fit). Use Ctrl+P and turn on background graphics.</p>
</body>
</html>
